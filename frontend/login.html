<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Growth Engine</title>
<link rel="stylesheet" href="login.css">
<script src="login.js" defer></script>
</head>
<body>
<main class="login">
<div class="login-stack">
  <form id="login-form" class="login-card" novalidate aria-labelledby="login-title">
    <header class="login-brand">
      <svg class="login-logo" width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
        <rect width="56" height="56" rx="14" fill="#2a5db0"></rect>
        <g stroke="#fff" stroke-width="3" stroke-linecap="round">
          <path d="M28 9v5M28 42v5M9 28h5M42 28h5M14.6 14.6l3.5 3.5M37.9 37.9l3.5 3.5M14.6 41.4l3.5-3.5M37.9 18.1l3.5-3.5"></path>
        </g>
        <circle cx="28" cy="28" r="8.5" fill="#fbbf24"></circle>
      </svg>
      <div class="login-brand-text">
        <h1 id="login-title" class="login-company">Bluesun International LLC</h1>
        <p class="login-product">Growth Engine</p>
      </div>
    </header>

    <div id="login-error" class="login-alert" role="alert" hidden></div>

    <div class="login-field">
      <label class="login-label" for="login-username">Username :</label>
      <div class="login-control">
        <svg class="login-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="7.5" r="4.5"></circle><path d="M3.5 21c0-4.4 3.8-7.5 8.5-7.5s8.5 3.1 8.5 7.5z"></path></svg>
        <input id="login-username" class="login-input" type="text" name="username" autocomplete="username"
               autocapitalize="none" spellcheck="false" maxlength="50" placeholder="Corp\identity or email" required>
      </div>
      <p id="login-username-error" class="login-field-error" hidden></p>
    </div>

    <div class="login-field">
      <label class="login-label" for="login-password">Password :</label>
      <div class="login-control login-password">
        <svg class="login-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3h-2.2V7a2.8 2.8 0 0 0-5.6 0v3z"></path><rect x="4" y="10" width="16" height="12" rx="2.5"></rect></svg>
        <input id="login-password" class="login-input" type="password" name="password" autocomplete="current-password"
               maxlength="200" placeholder="Enter your password" required>
        <button type="button" id="login-toggle" class="login-eye" aria-label="Show password" aria-pressed="false">
          <svg class="login-eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg class="login-eye-shut" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.1-5.9M9.9 5.2A9.6 9.6 0 0 1 12 5c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2"></path><path d="m2 2 20 20"></path></svg>
        </button>
      </div>
      <p id="login-password-error" class="login-field-error" hidden></p>
    </div>

    <div class="login-actions">
      <button type="button" id="login-clear" class="login-btn login-btn-outline">Clear</button>
      <button type="submit" id="login-submit" class="login-btn login-btn-primary">
        <span class="login-spinner" aria-hidden="true"></span>
        <span id="login-submit-label">Sign in</span>
        <svg class="login-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </form>

  <button type="button" id="login-create" class="login-link" aria-controls="login-note" aria-expanded="false">Create a company</button>
  <p id="login-note" class="login-note" role="status" hidden></p>
</div>
</main>
</body>
</html>
